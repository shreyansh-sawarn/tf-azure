name: 'Terragrunt CI/CD'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TERRAGRUNT_TFPATH: terraform

jobs:
  terragrunt:
    name: 'Terragrunt Plan & Apply'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v3

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: 'Setup Terragrunt'
        uses: autero1/action-terragrunt@v1.3.0
        with:
          terragrunt_version: 0.45.0

      - name: 'Terragrunt Plan (Dev)'
        if: github.event_name == 'pull_request'
        run: |
          cd environments/dev
          terragrunt run-all plan --terragrunt-non-interactive

      # The Apply step is commented out to prevent execution without a configured Azure environment.
      # In a live environment, this would run on a push to the main branch.
      # - name: 'Terragrunt Apply (Dev)'
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   run: |
      #     cd environments/dev
      #     terragrunt run-all apply --terragrunt-non-interactive
