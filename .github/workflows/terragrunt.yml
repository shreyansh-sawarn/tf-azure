name: 'Terragrunt CI/CD'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TERRAGRUNT_TFPATH: terraform
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: 'Code Quality Checks'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: 'Terraform Format Check'
        run: terraform fmt -check -recursive -diff

      - name: 'Setup TFLint'
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: 'Run TFLint'
        run: tflint --recursive --minimum-failure-severity=error

      - name: 'Security Scan (tfsec)'
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

      - name: 'Terraform Native Test'
        run: |
          echo "Finding and running unit tests for modules..."
          find modules -name "*.tftest.hcl" -exec dirname {} \; | sort -u | while read test_dir; do
            module_dir=$(dirname "$test_dir")
            echo "---------------------------------------------------"
            echo "Testing module in $module_dir"
            echo "---------------------------------------------------"
            terraform -chdir="$module_dir" init -backend=false
            terraform -chdir="$module_dir" test
          done

      - name: 'Setup Conftest'
        uses: princespaghetti/setup-conftest@v1
        with:
          version: latest

      - name: 'Setup Infracost'
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: 'Infracost (Dev)'
        if: github.event_name == 'pull_request'
        run: |
          cd environments/dev
          infracost breakdown --path . \
                            --format json \
                            --out-file /tmp/infracost.json

      - name: 'Post Infracost Comment'
        if: github.event_name == 'pull_request'
        run: |
          infracost comment github --path /tmp/infracost.json \
                                   --repo $GITHUB_REPOSITORY \
                                   --github-token ${{ github.token }} \
                                   --pull-request ${{ github.event.pull_request.number }} \
                                   --behavior update

      - name: 'Setup Python'
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Run AI FinOps Review'
        if: github.event_name == 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python aiops/cost_optimizer.py --infracost-json /tmp/infracost.json --output /tmp/cost_report.md
          else
            echo "GEMINI_API_KEY not configured, skipping AI FinOps review."
          fi

      - name: 'Post AI Cost Optimizer Comment'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/cost_report.md')) return;
            const report = fs.readFileSync('/tmp/cost_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            })

  plan:
    name: 'Terragrunt Plan'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: 'Setup Terragrunt'
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: 0.73.0

      - name: 'Terragrunt Plan (Dev)'
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          cd environments/dev
          # Run plan and capture output (using || true so pipeline doesn't crash on plan diffs if exitcode 2 is thrown)
          terragrunt run-all plan -no-color --terragrunt-non-interactive > /tmp/plan.txt 2>&1 || true

      - name: 'Post Plan Comment'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            // If plan doesn't exist (e.g. not a live env), fail gracefully
            if (!fs.existsSync('/tmp/plan.txt')) return;
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const output = `#### Terragrunt Plan Output 📖
            <details><summary>Click to expand</summary>

            \`\`\`terraform
            ${plan.length > 60000 ? plan.substring(0, 60000) + '... (truncated)' : plan}
            \`\`\`
            </details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: 'Setup Python'
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Run AI Failure Diagnostics'
        if: github.event_name == 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if grep -q "Error:" /tmp/plan.txt && [ -n "$GEMINI_API_KEY" ]; then
            echo "Plan errors found! Generating diagnostics report..."
            python aiops/failure_analyzer.py --error-log /tmp/plan.txt --output /tmp/failure_report.md
          else
            echo "No plan errors found or GEMINI_API_KEY missing."
          fi

      - name: 'Post AI Failure Comment'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/failure_report.md')) return;
            const report = fs.readFileSync('/tmp/failure_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            })

      - name: 'Run AI Security Review'
        if: github.event_name == 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd environments/dev
          # Convert plan to binary and JSON for the security reviewer to inspect
          terragrunt plan -out=/tmp/tfplan.binary -no-color --terragrunt-non-interactive || true
          terragrunt show -json /tmp/tfplan.binary > /tmp/tfplan.json || true
          
          if [ -f /tmp/tfplan.json ] && [ -n "$GEMINI_API_KEY" ]; then
            echo "Plan JSON found! Generating AI Security review..."
            python ../../aiops/security_reviewer.py --plan /tmp/tfplan.json --output /tmp/security_report.md
          else
            echo "Skipping AI Security Review (mock environment or GEMINI_API_KEY missing)."
          fi

      - name: 'Post AI Security Comment'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/security_report.md')) return;
            const report = fs.readFileSync('/tmp/security_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            })

      - name: 'Policy Check (Conftest)'
        if: github.event_name == 'pull_request'
        run: |
          echo "Running OPA policy checks against plan output..."
          # In a live environment, we would convert a specific plan to JSON:
          # terragrunt plan -out=tfplan.binary
          # terragrunt show -json tfplan.binary > tfplan.json
          # conftest test tfplan.json --policy policy/
          echo "Example command: conftest test tfplan.json --policy policy/"

      # The Apply step is commented out to prevent execution without a configured Azure environment.
      # In a live environment, this would run on a push to the main branch.
      # - name: 'Terragrunt Apply (Dev)'
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   run: |
      #     cd environments/dev
      #     terragrunt run-all apply --terragrunt-non-interactive
