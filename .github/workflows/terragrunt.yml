name: 'Terragrunt CI/CD'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TERRAGRUNT_TFPATH: terraform
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: 'Code Quality Checks'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: 'Terraform Format Check'
        run: terraform fmt -check -recursive -diff

      - name: 'Security Scan (tfsec)'
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true # Set to true for portfolio display, false for strict enforcement

      - name: 'Setup Infracost'
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: 'Infracost (Dev)'
        if: github.event_name == 'pull_request'
        run: |
          cd environments/dev
          infracost breakdown --path . \
                            --format json \
                            --out-file /tmp/infracost.json
          # Note: In a live env, we would use infracost comment github to post to PR

  plan:
    name: 'Terragrunt Plan'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: 'Setup Terragrunt'
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: 0.73.0

      - name: 'Terragrunt Plan (Dev)'
        if: github.event_name == 'pull_request'
        run: |
          cd environments/dev
          terragrunt run-all plan --terragrunt-non-interactive

      # The Apply step is commented out to prevent execution without a configured Azure environment.
      # In a live environment, this would run on a push to the main branch.
      # - name: 'Terragrunt Apply (Dev)'
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   run: |
      #     cd environments/dev
      #     terragrunt run-all apply --terragrunt-non-interactive
