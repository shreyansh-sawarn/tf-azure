name: 'AI Drift Detection Demo'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'aiops/**'
      - '.github/workflows/ai-drift-demo.yml'

jobs:
  ai-drift-demo:
    name: 'AI Drift Demo Audit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: 'Checkout Repo'
        uses: actions/checkout@v4

      - name: 'Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Execute AI Drift Analyzer'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python aiops/drift_analyzer.py \
              --plan aiops/mock_data/mock_tfplan.json \
              --policy-report aiops/mock_data/mock_opa_report.json \
              --output drift_report.md \
              --output-hcl-patch hcl_patch.hcl
          else
            python aiops/drift_analyzer.py --demo --output drift_report.md --output-hcl-patch hcl_patch.hcl
          fi

      - name: 'Execute AI Cost Optimizer (FinOps)'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python aiops/cost_optimizer.py \
              --infracost-json aiops/mock_data/mock_infracost.json \
              --output cost_report.md
          else
            python aiops/cost_optimizer.py --demo --output cost_report.md
          fi

      - name: 'Execute AI Failure Diagnostics'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python aiops/failure_analyzer.py \
              --error-log aiops/mock_data/failed_deploy.log \
              --output failure_report.md
          else
            python aiops/failure_analyzer.py --demo --output failure_report.md
          fi

      - name: 'Execute AI OPA Policy Generator Demo'
        run: |
          python aiops/policy_generator.py \
            --prompt "Ensure Storage Account HTTPS traffic only" \
            --demo

      - name: 'Publish AI Suite Reports to Job Summary'
        run: |
          echo "# 🤖 Unified AIOps Lifecycle Suite Audit" >> $GITHUB_STEP_SUMMARY
          echo "This dashboard showcases the automated AI assistance suite running through all IaC lifecycle phases." >> $GITHUB_STEP_SUMMARY
          
          echo "## 1. 🔍 Drift & Compliance Audit (Monitoring Phase)" >> $GITHUB_STEP_SUMMARY
          cat drift_report.md >> $GITHUB_STEP_SUMMARY
          echo -e "\n---\n" >> $GITHUB_STEP_SUMMARY
          
          echo "## 2. 💰 FinOps Cost Optimization (Review Phase)" >> $GITHUB_STEP_SUMMARY
          cat cost_report.md >> $GITHUB_STEP_SUMMARY
          echo -e "\n---\n" >> $GITHUB_STEP_SUMMARY
          
          echo "## 3. 🚨 Deployment Failure Diagnostics (Debugging Phase)" >> $GITHUB_STEP_SUMMARY
          cat failure_report.md >> $GITHUB_STEP_SUMMARY

      - name: 'Upload Audit Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: aiops-lifecycle-suite-reports
          path: |
            drift_report.md
            cost_report.md
            failure_report.md
            hcl_patch.hcl
